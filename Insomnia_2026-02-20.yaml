            method: PUT
            body:
              mimeType: application/json
              text: |-
                {
                	"firstname": "Anneh",
                	"lastname": "Lore",
                	"totalprice": 333,
                	"depositpaid": true,
                	"bookingdates": {
                		"checkin": "2026-03-17",
                		"checkout": "2026-04-07"
                	},
                	"additionalneeds": "Breakfast and Towels"
                }
            headers:
              - name: User-Agent
                value: insomnia/12.3.1
                description: ""
                disabled: false
              - name: Content-Type
                value: application/json
              - name: Cookie
                value: token={% response 'body', 'req_ac96b9539f8149e3a46b2042f0cf7f34',
