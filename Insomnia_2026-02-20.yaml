            scripts:
              afterResponse: >+
                insomnia.test('The status code should be 200', async () => {
                	insomnia.expect(insomnia.response.code).to.equal(200);
                });


                insomnia.test('The response should be contain all fields', async
                () => {
                	const json = JSON.parse(insomnia.response.body);
                	insomnia.expect(json).to.have.all.keys('firstname', 'lastname', 'totalprice', 'depositpaid', 'bookingdates', 'additionalneeds');
                });


                insomnia.test('The fields should be updated', async () => {
                	const json = JSON.parse(insomnia.response.body);
                	insomnia.expect(json.firstname).to.equal('Anneh');
                	insomnia.expect(json.lastname).to.equal('Lore');
                	insomnia.expect(json.totalprice).to.equal(333);
                	insomnia.expect(json.depositpaid).to.equal(true);
                	insomnia.expect(json.bookingdates.checkin).to.equal('2026-03-17');
                	insomnia.expect(json.bookingdates.checkout).to.equal('2026-04-07');
                	insomnia.expect(json.additionalneeds).to.equal('Breakfast and Towels');
                });

            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
