              created: 1770902562372
              modified: 1771594083937
              isPrivate: false
              description: ""
              sortKey: -1771594083904
            method: POST
            body:
              mimeType: application/json
              text: |-
                {
                	"firstname": "{{ _.first_name }}",
                	"lastname": "{{ _.last_name }}",
                	"totalprice" : 111,
                	"depositpaid" : true,
                	"bookingdates" : {
                			"checkin" : "{{ _.booking_date_checkin }}",
                			"checkout" : "{{ _.booking_date_checkout }}"
                	},
                	"additionalneeds" : "Breakfast"
                }
            headers:
              - name: Content-Type
                value: application/json
              - name: User-Agent
                value: insomnia/12.3.1
                description: ""
                disabled: false
            scripts:
              afterResponse: >-
                insomnia.test('The status code should be 200/201', async () =>{
                	insomnia.expect([200,201]).to.include(insomnia.response.code);
                });


                insomnia.test('Response should be contain bookingid numeric and
                booking object', async () =>{
                	const json = JSON.parse(insomnia.response.body);
                	insomnia.expect(json).to.have.property('booking');
                	insomnia.expect(json.bookingid).to.be.an('number');
                	insomnia.expect(json).to.have.property('booking');
                	
                	const booking_info = json.booking;
                	insomnia.expect(booking_info).to.include.all.keys( 
                		'firstname', 'lastname', 'totalprice', 'depositpaid', 'bookingdates', 								'additionalneeds');
                	insomnia.expect(booking_info.bookingdates).to.include.all.keys(
                		'checkin','checkout');
                });


                insomnia.test('Fixed payload values should be correct', async ()
                =>{
                	const {booking} = JSON.parse(insomnia.response.body);
                	insomnia.expect(booking.totalprice).to.equal(111);
                  insomnia.expect(booking.depositpaid).to.equal(true);
                  insomnia.expect(booking.additionalneeds).to.equal('Breakfast');
                });
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: global
              cookies:
                send: true
                store: true
              rebuildPath: true
